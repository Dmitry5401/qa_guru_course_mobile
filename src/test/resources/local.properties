# Локальный прогон: Appium на своей машине + эмулятор или телефон в adb devices.
# Адрес должен совпадать с базовым путём сервера, иначе тот отдаёт 404. Суффикс /wd/hub
# здесь — под сервер, поднятый как `appium --base-path /wd/hub`. Если запускать просто
# `appium`, он слушает корень, и суффикс надо убрать. Расхождение ловит проверка
# в LocalDriver до создания сессии и подсказывает рабочий адрес.
LOCAL_APPIUM_URL=http://localhost:4723/wd/hub

# Куда идти тесту. Приоритет: LOCAL_AVD, затем LOCAL_DEVICE_UDID, затем
# LOCAL_PLATFORM_VERSION, а если всё пусто — первое устройство из `adb devices`.
#
# LOCAL_AVD — имя виртуального устройства из Device Manager, например Pixel_10a.
# Для эмулятора это удобнее серийника: имя не меняется, а порт в emulator-5554
# зависит от порядка запуска. Appium ещё и сам поднимет эмулятор, если он не запущен.
#
# LOCAL_DEVICE_UDID — серийник реального телефона из `adb devices`.
#
# Оба ключа переопределяются через -D, так что менять файл ради смены устройства
# не нужно: ./gradlew test --tests "tests.local.*" -DLOCAL_AVD=Pixel_10a
LOCAL_AVD=
LOCAL_DEVICE_UDID=
LOCAL_PLATFORM_VERSION=

# Версия прибита гвоздями намеренно: у тега latest в GitHub сборка меняется каждый день,
# и вместе с ней уезжают локаторы. В этой сборке ещё классическая View-вёрстка
# с resource-id, на которые опираются тесты, а targetSdk 33 работает и на новых Android.
LOCAL_APP_URL=https://releases.wikimedia.org/mobile/android/wikipedia/stable/wikipedia-2.7.50450-r-2023-08-15.apk
LOCAL_APP_PACKAGE=org.wikipedia
LOCAL_APP_ACTIVITY=org.wikipedia.main.MainActivity
