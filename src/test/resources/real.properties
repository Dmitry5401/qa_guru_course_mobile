# Стенд -DdeviceHost=real: телефон, подключённый к своей машине по USB.
# Общие настройки (адрес Appium и приложение) — в local.properties.

# Серийник устройства из `adb devices`, например R58R611HJWD. Appium смотрит именно
# на него: deviceName на выбор устройства не влияет.
#
# Пусто — возьмётся первое устройство из списка. Это рискованно, когда рядом поднят
# эмулятор: он может оказаться первым, и тест уйдёт не туда.
#
# Ключ переопределяется через -D, так что менять файл ради смены устройства не нужно:
# ./gradlew test -DdeviceHost=real -DREAL_DEVICE_UDID=R58R611HJWD
REAL_DEVICE_UDID=

# Язык устройства, а вместе с ним и язык статей в приложении. Нужен ArticleTests:
# статья «Java» в английском разделе — про остров в Индонезии, а в русском — про язык
# программирования, и сценарий у них разный.
#
# ВНИМАНИЕ, у этого стенда есть цена: телефон обычно личный, а Appium язык обратно
# не возвращает. Он восстанавливает после сессии клавиатуру, анимации и hidden-api
# policy — язык в этот список не входит, так что телефон останется английским, пока
# не вернуть язык руками в настройках.
#
# Если менять язык телефона не хочется, ключ гасится на прогон. Тогда пройдут все тесты,
# кроме ArticleTests: остальные ищут элементы по resource-id и от языка не зависят.
# ./gradlew test -DdeviceHost=real -DLOCAL_LANGUAGE= -DLOCAL_LOCALE=
LOCAL_LANGUAGE=en
LOCAL_LOCALE=US
