# Стенд -DdeviceHost=real: телефон, подключённый к своей машине по USB.
# Общие настройки (адрес Appium и приложение) — в local.properties.

# Серийник устройства из `adb devices`, например R58R611HJWD. Appium смотрит именно
# на него: deviceName на выбор устройства не влияет.
#
# Пусто — возьмётся первое устройство из списка. Это рискованно, когда рядом поднят
# эмулятор: он может оказаться первым, и тест уйдёт не туда.
#
# Ключ переопределяется через -D, так что менять файл ради смены устройства не нужно:
# ./gradlew test -DdeviceHost=real -DREAL_DEVICE_UDID=R58R611HJWD
REAL_DEVICE_UDID=
