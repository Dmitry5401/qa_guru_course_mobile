# Стенд -DdeviceHost=browserstack: устройство в облаке App Automate.
# Логин и ключ лежат отдельно, в auth.properties.
BROWSERSTACK_HUB=https://hub.browserstack.com/wd/hub
BROWSERSTACK_APPIUM_VERSION=2.0.1

# custom_id приложения, загруженного в App Automate. Это та же сборка Wikipedia,
# что тесты ставят на локальных стендах (см. LOCAL_APP_URL), поэтому один и тот же
# тест проходит на всех трёх стендах. custom_id удобнее app_url вида bs://<hash>:
# он переживает повторную загрузку, а app_url каждый раз новый.
BROWSERSTACK_ANDROID_APP_ID=WikipediaStable27
BROWSERSTACK_ANDROID_DEVICE=Samsung Galaxy S23
BROWSERSTACK_ANDROID_OS_VERSION=13.0

# Язык устройства, а вместе с ним и язык статей в приложении. Нужен ArticleTests:
# статья «Java» в английском разделе — про остров в Индонезии, а в русском — про язык
# программирования, и сценарий у них разный. Значение одно на все стенды, иначе один
# и тот же тест видел бы в облаке не то, что на своей машине.
BROWSERSTACK_ANDROID_LANGUAGE=en
BROWSERSTACK_ANDROID_LOCALE=US

# iOS всегда идёт в облако: локального стенда для него нет, нужен macOS с Xcode.
BROWSERSTACK_IOS_APP_ID=BStackSampleApp
BROWSERSTACK_IOS_DEVICE=iPhone 14
BROWSERSTACK_IOS_OS_VERSION=16
