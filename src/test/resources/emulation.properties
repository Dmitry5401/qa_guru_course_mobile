# Стенд -DdeviceHost=emulation: эмулятор на своей машине.
# Общие настройки (адрес Appium и приложение) — в local.properties.

# Имя виртуального устройства из Device Manager, например Pixel_10a.
# Для эмулятора это удобнее серийника: имя не меняется, а номер в emulator-5554
# зависит от порядка запуска. Appium по этому ключу ещё и сам поднимет эмулятор,
# если он не запущен.
#
# Пусто — возьмётся первое устройство из `adb devices`. Задавать имя обязательно,
# только если рядом подключено что-то ещё.
#
# Ключ переопределяется через -D, так что менять файл ради смены устройства не нужно:
# ./gradlew test -DdeviceHost=emulation -DEMULATION_AVD=Pixel_10a
EMULATION_AVD=

# Язык устройства, а вместе с ним и язык статей в приложении. Нужен ArticleTests:
# статья «Java» в русском разделе — про язык программирования, а в английском — про
# остров в Индонезии, и сценарий у них разный. Эмулятор одноразовый, поэтому язык ему
# переключаем без оглядки; стенд real язык не трогает — см. real.properties.
LOCAL_LANGUAGE=ru
LOCAL_LOCALE=RU
