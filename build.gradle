plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
}

wrapper {
    gradleVersion = '8.13'
}

group = 'guru.qa'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def aspectjWeaverVersion = "1.9.22",
    selenideVersion = "6.13.0",
    restAssuredVersion = "6.0.0",
    allureVersion = "2.32.0",
    junitVersion = "5.14.3",
    slf4jVersion = "2.0.17",
    appiumVersion = "8.3.0",
    ownerVersion = "1.0.12"


allure
        {
            report {
                version.set(allureVersion)
            }
            adapter { // отвечает за появление папочки build/allure-results
                aspectjWeaver.set(true) //обработка аннотации @Step
                frameworks {
                    junit5 { //название фреймворка
                        adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
                    }
                }
            }
        }

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junitVersion}"))
    // Без явной версии — возьмётся из BOM
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    // Опционально: движок и лаунчер будут подхватываться через BOM
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    testImplementation("org.aspectj:aspectjweaver:$aspectjWeaverVersion")
    testImplementation("com.codeborne:selenide:$selenideVersion")
    testImplementation("io.qameta.allure:allure-selenide:$allureVersion")
    testImplementation("io.appium:java-client:$appiumVersion")
    testImplementation("io.rest-assured:rest-assured:$restAssuredVersion")
    testImplementation("org.aeonbits.owner:owner:$ownerVersion")
    testImplementation("org.slf4j:slf4j-simple:$slf4jVersion")
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}